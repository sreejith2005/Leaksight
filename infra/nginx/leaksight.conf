# ===========================
# LeakSight V1 — Production Nginx Configuration
# ===========================
# Source: infra setup guide (Sections 6, 7), docs/ARCHITECTURE.md (Section 7)
#
# Deploy to: /opt/leaksight/nginx/conf/leaksight.conf
#
# BEFORE DEPLOYING: Replace YOUR_DOMAIN_HERE with your actual domain.
#
# Features:
#   - HTTP → HTTPS 301 redirect
#   - TLS 1.2/1.3 only (no older protocols)
#   - Six security headers (re-declared in /api/ location block)
#   - 200MB upload limit (matches MAX_UPLOAD_SIZE_MB)
#   - 300s proxy timeout (for long-running parse/report jobs)
#   - /data/ path blocked (document storage never publicly accessible)
#   - Static asset caching (30 days, immutable)
#   - SPA routing (try_files for React Router)

# ===========================
# HTTP → HTTPS redirect
# ===========================
server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;
    return 301 https://$host$request_uri;
}

# ===========================
# HTTPS server
# ===========================
server {
    listen 443 ssl;
    server_name YOUR_DOMAIN_HERE;

    # --- TLS ---
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Upload limit (matches 200MB cap from config.py / .env) ---
    client_max_body_size 200M;

    # --- Timeouts for long-running parse/report jobs ---
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    proxy_send_timeout 300s;

    # --- Security Headers (server-level) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- API routes (proxy to FastAPI backend) ---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Re-apply security headers inside location block.
        # Nginx drops server-level add_header in location blocks that
        # define their own add_header — this is a known Nginx behaviour.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # --- Frontend static files (React build output) ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache static assets — 30 days, immutable
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 30d;
            add_header Cache-Control "public, immutable, max-age=2592000";
        }
    }

    # --- Block direct access to document storage ---
    # Documents are served only via authenticated API endpoints.
    # This path must never be publicly accessible.
    location /data/ {
        deny all;
        return 403;
    }
}
